[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vortis"
dynamic = ["version"]
description = "Vortis: a personal, local-first assistant with voice, hand gestures and a HUD"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Milos S"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.14.4",
    "click>=8",
    "croniter>=2.0",
    "ddgs>=9.11.4",
    "httpx>=0.27",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "lxml>=6.1.0",
    "multidict>=6.9.1",
    "openai>=1.30",
    "packaging>=24",
    "nvidia-ml-py>=12.560.30",
    "psutil>=5.9",
    "python-telegram-bot>=22.8",
    "rich>=13",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "tomlkit>=0.12",
    "tzdata>=2025.3",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.12.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "respx>=0.22",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "numpy>=1.24",
]
inference-mlx = ["mlx-lm>=0.31.1; sys_platform == 'darwin'"]
inference-vllm = ["vllm>=0.32.0"]
inference-cloud = [
    "openai>=1.30",
    "anthropic>=0.30",
]
inference-google = [
    "google-genai>=1.0",
]
inference-litellm = ["litellm==1.109.1"]
inference-gemma = ["pygemma>=0.1.3"]
tools-search = [
    "tavily-python>=0.3",
    "ddgs>=9.11.4",
]
memory-faiss = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]
memory-colbert = [
    "colbert-ai>=0.2",
    "torch>=2.0",
]
memory-pdf = ["pdfplumber>=0.10"]
memory-bm25 = ["rank-bm25>=0.2.2"]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]
desktop = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "av>=11,<19",
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.24",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]
voice = [
    "kokoro>=0.9",
    "soundfile>=0.12",
    "sounddevice>=0.5",  # play_wav / record_until_silence in speech/voice_io.py
    "numpy>=1.24",
]
openhands = ["openhands-sdk>=1.0; python_version >= '3.12'"]
afm = ["apple-fm-sdk>=0.2.1; sys_platform == 'darwin'"]
gpu-metrics = ["pynvml>=12.0"]
energy-amd = ["amdsmi>=6.1"]
energy-apple = ["zeus-apple-silicon>=1.1.0; sys_platform == 'darwin'"]
energy-all = [
    "pynvml>=12.0",
    "amdsmi>=6.1",
    "zeus-apple-silicon>=1.1.0; sys_platform == 'darwin'",
]
orchestrator-training = ["torch>=2.0", "transformers>=4.40"]
learning-dspy = ["dspy>=3.5.0"]
learning-gepa = ["gepa>=0.1"]
channel-telegram = ["python-telegram-bot>=21.0"]
channel-discord = ["discord.py>=2.3"]
channel-slack = ["slack-sdk>=3.27"]
channel-line = ["line-bot-sdk>=3.0"]
channel-viber = ["viberbot>=1.0"]
channel-messenger = ["pymessenger>=0.0.7"]
channel-reddit = ["praw>=7.0"]
channel-mastodon = ["Mastodon.py>=1.8"]
channel-xmpp = ["slixmpp>=1.8"]
channel-rocketchat = ["rocketchat-API>=1.30"]
channel-zulip = ["zulip>=0.9"]
channel-twitter = ["httpx>=0.27"]
channel-twitch = ["twitchio>=2.6"]
channel-nostr = ["pynostr>=0.6"]
channel-twilio = ["twilio>=9.0"]
channel-gmail = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]
browser = ["playwright>=1.40"]
media = ["openai>=1.30"]
pdf = ["pdfplumber>=0.10"]
scheduler = ["croniter>=2.0"]
security-signing = ["cryptography>=43"]
sandbox-wasm = ["wasmtime>=25"]
sandbox-docker = ["docker>=7.0"]
dashboard = ["textual>=0.80"]
speech = [
    "faster-whisper>=1.0",
    "av>=11,<19",
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.24",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]
speech-deepgram = ["deepgram-sdk>=3.0"]
eval-wandb = ["wandb>=0.17"]
eval-sheets = ["gspread>=6.0", "google-auth>=2.0"]
framework-comparison = ["polars>=1.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.urls]
Homepage = "https://github.com/Luka-T1/Vortis"
Repository = "https://github.com/Luka-T1/Vortis"
Issues = "https://github.com/Luka-T1/Vortis/issues"

[project.scripts]
vortis = "vortis.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "v[0-9]*", "--exclude", "*dev*", "--exclude", "*rc*", "--exclude", "desktop-*",
]
fallback_version = "0.0.0+unknown"

[tool.uv.sources]
vortis-rust = { path = "rust/crates/vortis-python" }

[tool.hatch.build.targets.sdist]
exclude = [
    "/desktop/src-tauri/binaries",
    "/frontend/src-tauri/binaries",
]
artifacts = ["/src/vortis/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/vortis"]
artifacts = ["/src/vortis/server/static/**"]
exclude = [
    "/src/vortis/agents/claude_code_runner",
]

[tool.hatch.build.targets.wheel.force-include]
"src/vortis/agents/claude_code_runner/index.mjs" = "_node_modules/claude_code_runner/index.mjs"
"src/vortis/agents/claude_code_runner/account.mjs" = "_node_modules/claude_code_runner/account.mjs"
"src/vortis/agents/claude_code_runner/package.json" = "_node_modules/claude_code_runner/package.json"
"src/vortis/channels/whatsapp_baileys_bridge" = "_node_modules/whatsapp_baileys_bridge"
"scripts/install" = "_install_scripts"
"deploy/windows" = "_deploy/windows"
"configs/vortis/examples" = "vortis/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "amd: requires AMD GPU",
    "apple: requires Apple Silicon",
    "cloud: requires cloud API keys",
    "docker: requires a working Docker daemon (no GPU required)",
    "live: requires running inference engine",
    "macos15: requires macOS 15+ (Sequoia) for Apple FM",
    "live_channel: requires real channel credentials (env vars)",
    "nvidia: requires NVIDIA GPU",
    "slow: long-running test",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/vortis/agents/hybrid/**/*.py" = ["E501"]
"src/vortis/agents/research_loop.py" = ["E501"]

[dependency-groups]
dev = [
    "maturin>=1.12.6",
]
desktop-native = [
    "vortis-rust",
]
